<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Bornes de Gonflage — Angers Mob Service</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#3B6D11;--gl:#EAF3DE;--gm:#639922;--gc:#C0DD97;
  --o:#BA7517;--ol:#FAEEDA;
  --r:#A32D2D;--rl:#FCEBEB;
  --p:#534AB7;--pl:#EEEDFE;
  --bg:#F5F7F5;--card:#fff;
  --text:#1a1a1a;--muted:#666;
  --border:#e0e0e0;--border2:#ccc;
  --radius:12px;--radius-sm:8px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1a1e1a;--card:#252b25;
    --text:#e8e8e8;--muted:#999;
    --border:#333;--border2:#444;
  }
}
html,body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);min-height:100vh}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg)}

/* Header */
.hdr{background:var(--g);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.hdr-back{width:34px;height:34px;border-radius:8px;border:none;background:rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:18px}
.hdr-back:active{background:rgba(255,255,255,.35)}
.hdr-title{font-size:15px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-sub{font-size:11px;opacity:.75}
.hdr-btn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:7px 13px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:5px}
.hdr-btn:active{background:rgba(255,255,255,.35)}

/* Page */
.pg{padding:14px 14px 36px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 6px;text-align:center}
.stat-n{font-size:22px;font-weight:700;color:var(--g)}
.stat-l{font-size:11px;color:var(--muted);margin-top:2px}

/* Section label */
.sec{font-size:12px;font-weight:600;color:var(--muted);margin:0 2px 8px;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.04em}
.mt{margin-top:18px}

/* Station cards */
.sc{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sc:active{background:var(--gl)}
.sc-ic{width:40px;height:40px;border-radius:10px;background:var(--gl);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--g);font-size:20px}
.sc-ic.fx{background:var(--pl);color:var(--p)}
.sc-in{flex:1;min-width:0}
.sc-ad{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-ty{font-size:12px;color:var(--muted);margin-top:2px}
.sc-me{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.gps-btn{font-size:16px;text-decoration:none;line-height:1;display:block}
.sc-ct{font-size:11px;background:var(--gl);color:var(--g);border-radius:20px;padding:3px 9px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}

/* Inspection rows */
.ir{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 13px;margin-bottom:8px;display:flex;align-items:center;gap:10px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ir:active{background:var(--gl)}
.ir-d{font-size:14px;font-weight:600}
.ir-a{font-size:12px;color:var(--muted)}
.tags{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px}
.b-ok{background:var(--gl);color:var(--g)}
.b-w{background:var(--ol);color:var(--o)}
.b-i{background:#E6F1FB;color:#185FA5}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.ct{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;text-transform:uppercase;letter-spacing:.03em}
.ctl{display:flex;align-items:center;gap:6px}

/* Fields */
.field{margin-bottom:12px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;padding:10px 13px;border:1.5px solid var(--border2);border-radius:var(--radius-sm);font-size:15px;font-family:inherit;color:var(--text);background:var(--card);-webkit-appearance:none}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--gm)}
.field textarea{min-height:72px;resize:vertical}

/* Checkboxes */
.ci{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:var(--radius-sm);cursor:pointer;-webkit-tap-highlight-color:transparent}
.ci:active{background:var(--bg)}
.ci input[type=checkbox]{width:20px;height:20px;cursor:pointer;accent-color:var(--gm);flex-shrink:0}
.ci span{font-size:14px;user-select:none;line-height:1.3}

/* Photos */
.ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph-w{position:relative}
.ph-img{aspect-ratio:1;width:100%;border-radius:8px;object-fit:cover;border:1px solid var(--border);display:block}
.ph-del{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--r);color:#fff;border:none;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:700}
.ph-add{aspect-ratio:1;border:2px dashed var(--border2);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;background:var(--gl);color:var(--g);font-size:12px;font-weight:600;-webkit-tap-highlight-color:transparent}
.ph-add:active{background:var(--gc)}
.ph-add-icon{font-size:26px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 18px;border-radius:var(--radius-sm);border:1.5px solid var(--border2);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--text);background:var(--card);-webkit-tap-highlight-color:transparent}
.btn:active{opacity:.75}
.btn-p{background:var(--g);color:#EAF3DE;border-color:var(--g)}
.btn-p:active{background:#27500A}
.btn-f{width:100%}
.btn-d{background:var(--rl);color:var(--r);border-color:var(--r)}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-row{display:flex;gap:8px}
.btn-row .btn{flex:1}

/* Detail rows */
.dr{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.dr:last-child{border:none}
.dl{font-size:13px;color:var(--muted)}
.dv{font-size:13px;font-weight:600;text-align:right}

/* Check view items */
.cvi{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--border)}
.cvi:last-child{border:none}
.cvi-ic{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.cvi-l{font-size:13px}

/* Empty state */
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty-icon{font-size:48px;margin-bottom:14px}
.empty-text{font-size:15px;line-height:1.5}

/* Alert card */
.alert-card{border:1.5px solid var(--r);background:var(--rl);border-radius:var(--radius);padding:14px;margin-top:10px}
.alert-title{font-weight:700;color:var(--r);margin-bottom:8px;font-size:14px}
.alert-body{font-size:13px;color:var(--r);margin-bottom:12px}

/* Lignes de contrôle radio */
.chk-header{display:grid;grid-template-columns:1fr 48px 48px 58px;gap:4px;font-size:11px;font-weight:600;color:var(--muted);text-align:center;padding:0 0 6px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.03em}
.chk-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.chk-lbl{font-size:13px;line-height:1.3}
.chk-opts{display:flex;gap:6px}
.chk-opt{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;width:48px}
.chk-opt span{font-size:10px;font-weight:600;color:var(--muted)}
.chk-opt input[type=radio]{width:20px;height:20px;cursor:pointer;margin:0}
.ok-opt input{accent-color:#639922}
.def-opt input{accent-color:#BA7517}
.rem-opt input{accent-color:#c0392b}
.ok-opt span{color:#639922}
.def-opt span{color:#BA7517}
.rem-opt span{color:#c0392b}
/* Tableau devis */
.devis-wrap{overflow-x:auto;margin:0 -4px}
.devis-tbl{width:100%;border-collapse:collapse;font-size:12px}
.devis-tbl th{text-align:left;font-size:11px;font-weight:600;color:var(--muted);padding:4px 5px;border-bottom:1.5px solid var(--border);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.devis-tbl td{padding:4px 3px;border-bottom:1px solid var(--border);vertical-align:middle}
.devis-tbl.devis-ro td{font-size:13px;padding:6px 5px}
.devis-in{width:100%;border:1px solid var(--border);border-radius:6px;padding:5px 6px;font-size:12px;background:var(--card);color:var(--text)}
.devis-des{min-width:120px}
.devis-sm{max-width:60px}
.devis-del{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:0 4px;line-height:1}
.devis-del:hover{color:var(--r)}

/* Vue rapport */
.rpt-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.rpt-row.rpt-unchecked{opacity:.45}
.rpt-check{display:flex;align-items:center;gap:10px;cursor:pointer;flex:1;min-width:0}
.rpt-check input[type=checkbox]{width:20px;height:20px;accent-color:var(--gm);flex-shrink:0}
.rpt-st-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rpt-st-type{font-size:11px;color:var(--muted);margin-top:1px}
.rpt-sel{border:1px solid var(--border);border-radius:8px;padding:5px 8px;font-size:12px;background:var(--card);color:var(--text);max-width:180px;flex-shrink:0}
.rpt-none{font-size:11px;color:var(--muted);font-style:italic;flex-shrink:0}
.rpt-all-lbl{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--g);cursor:pointer}
.rpt-all-lbl input{width:16px;height:16px;accent-color:var(--gm)}

.mt8{margin-top:8px}
.mt16{margin-top:16px}
.mt4{margin-top:4px}
</style>
</head>
<body>
<div id="app">
  <div style="display:flex;align-items:center;justify-content:center;height:100vh;color:var(--muted)">Chargement…</div>
</div>
<input type="file" id="ph-in" accept="image/*" multiple capture="environment" style="display:none">

<script>
/* ── Data ── */
const INIT=[
  {id:'s1',type:'ALTAO Pump',addr:'Bd Victor Beaussier / Av. Gén. Patton'},
  {id:'s2',type:'ALTAO Pump',addr:'Place André Leroy'},
  {id:'s3',type:'ALTAO Pump',addr:'Parvis de la Gare'},
  {id:'s4',type:'ALTAO Pump',addr:"Av. Yolande d'Aragon — Parc Balzac"},
  {id:'s5',type:'ALTAO Pump',addr:'Av. Pasteur / Av. Gén. Foy'},
  {id:'s6',type:"ALTAO Fix'Air",addr:'Allée des Baladins'},
  {id:'s7',type:"ALTAO Fix'Air",addr:'13 Bd Georges Clémenceau'},
  {id:'s8',type:"ALTAO Fix'Air",addr:'Esplanade François Mitterrand'},
  {id:'s9',type:"ALTAO Fix'Air",addr:'Place des Justices'},
  {id:'s10',type:"ALTAO Fix'Air",addr:'Place de la Fraternité'},
];
/* ── Éléments contrôlés par type de borne ── */
const STRUCT_PUMP=[
  ['struct_pied','Structure / pied (déformation, corrosion)'],
  ['struct_fix','Fixation au sol (chevilles béton, tirefonds)'],
  ['struct_flancs','Flancs RAL 9006 — état et fixation'],
  ['struct_fente','Logement fente RAL 9006 — état'],
  ['struct_verre','Polycarbonate (vitre) — état et transparence'],
  ['struct_serrure','Serrure octo 18mm H412955 — état et fonctionnement'],
];
const STRUCT_FIXAIR=[
  ['struct_proprete','Propreté générale de la station'],
  ['struct_pied','Structure / pied (déformation, corrosion)'],
  ['struct_fix','Fixation au sol (chevilles, tirefonds)'],
  ['struct_serrure','Serrure octo 18mm H412955 — état et fonctionnement'],
];
const GONFLAGE_PUMP=[
  ['gonf_tuyau','Tuyau tressé métallique lg 69cm — état général'],
  ['gonf_embout','Embout gonflage Schrader/Presta/Dunlop (BBB) — présent et fonctionnel'],
  ['gonf_raccord','Raccord manomètre Pump — état et étanchéité'],
  ['gonf_mano','Ensemble manomètre — lisibilité et précision'],
  ['gonf_verin','Vérin Pump (ensemble) — fonctionnement'],
  ['gonf_pedale','Pédale Pump avec visserie — état et fixation'],
];
const GONFLAGE_FIXAIR=[
  ['gonf_tuyau','Tuyau tressé métallique lg 69cm — état général'],
  ['gonf_embout','Embout gonflage Schrader/Presta/Dunlop (BBB) — présent et fonctionnel'],
  ['gonf_raccord','Raccord manomètre Pump — état et étanchéité'],
  ['gonf_mano','Ensemble manomètre — lisibilité et précision'],
  ['gonf_levier','Levier de pompe (présence)'],
  ['gonf_verin','Vérin Pump (ensemble) — fonctionnement'],
];
const KIT_FIXAIR=[
  ['kit1','Outil 1 — Démonte pneu : présent, câble et sertissage intact'],
  ['kit2','Outil 2 — Démonte pneu : présent, câble et sertissage intact'],
  ['kit3','Outil 3 — Tournevis plat : présent, câble et sertissage intact'],
  ['kit4','Outil 4 — Tournevis cruciforme : présent, câble et sertissage intact'],
  ['kit5','Outil 5 — Clé plate de 15 : présente, câble et sertissage intact'],
  ['kit6','Outil 6 — Clé Torx : présente, câble et sertissage intact'],
  ['kit7','Outil 7 — Ensemble clé allen (BTR) : présent, câble et sertissage intact'],
];
const NETT_PUMP=[
  ['nett_ext','Nettoyage structure extérieure'],
  ['nett_tuyau','Nettoyage tuyau et embouts'],
  ['nett_verre','Nettoyage vitre / polycarbonate'],
  ['nett_abords','Dégagement des abords immédiats'],
];
const NETT_FIXAIR=[
  ['nett_ext','Nettoyage structure extérieure'],
  ['nett_outils','Nettoyage des outils et câbles'],
  ['nett_abords','Dégagement des abords immédiats'],
];

/* Helper : renvoie les listes selon le type de borne */
function getSections(type){
  const isFixAir=type&&type.includes("Fix");
  return {
    struct: isFixAir?STRUCT_FIXAIR:STRUCT_PUMP,
    gonflage: isFixAir?GONFLAGE_FIXAIR:GONFLAGE_PUMP,
    kit: isFixAir?KIT_FIXAIR:null,
    nett: isFixAir?NETT_FIXAIR:NETT_PUMP,
  };
}

/* ── State ── */
const ADMIN_PWD='ams2025'; /* ← mot de passe admin à changer */
const S={view:'home',stations:[],inspections:[],sid:null,iid:null,form:null,isAdmin:false,editIid:null};

/* ── Utils ── */
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const fdate=d=>d?d.split('-').reverse().join('/'):'';
const today=()=>new Date().toISOString().slice(0,10);
const mkC=arr=>Object.fromEntries(arr.map(([k])=>[k,false]));
function mkForm(sid){
  const st=S.stations.find(s=>s.id===sid);
  const sec=getSections(st?st.type:'');
  return {
    id:uid(),sid,date:today(),agent:'',
    struct:mkC(sec.struct),
    gonflage:mkC(sec.gonflage),
    kit:sec.kit?mkC(sec.kit):null,
    nett:mkC(sec.nett),
    devis:[{ref:'',designation:'',qte:'',pu:''}],
    note:'',photos:[]
  };
}

/* ── Storage ── */
/* ── Supabase ── */
/* ── Firebase Realtime Database ── */
const FB_URL='https://envie-anjou-sav-default-rtdb.europe-west1.firebasedatabase.app/bornes';

const DB={
  async getStations(){
    const r=await fetch(FB_URL+'/stations.json');
    if(!r.ok)throw new Error('Erreur chargement bornes');
    const data=await r.json();
    if(!data)return[];
    return Object.entries(data)
      .map(([id,v])=>({id,...v}))
      .sort((a,b)=>a.addr.localeCompare(b.addr));
  },
  async upsertStation(st){
    const {id,...rest}=st;
    const r=await fetch(FB_URL+'/stations/'+encodeURIComponent(id)+'.json',{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(rest)
    });
    if(!r.ok)throw new Error('Erreur sauvegarde borne');
  },
  async deleteStation(id){
    const r=await fetch(FB_URL+'/stations/'+encodeURIComponent(id)+'.json',{method:'DELETE'});
    if(!r.ok)throw new Error('Erreur suppression borne');
    const insps=await this.getInspections();
    await Promise.all(insps.filter(i=>i.sid===id).map(i=>this.deleteInspection(i.id)));
  },
  async getInspections(){
    const r=await fetch(FB_URL+'/inspections.json');
    if(!r.ok)throw new Error('Erreur chargement contrôles');
    const data=await r.json();
    if(!data)return[];
    return Object.entries(data)
      .map(([id,v])=>({
        id,
        sid:v.sid||'',date:v.date||'',agent:v.agent||'',
        struct:v.struct||{},gonflage:v.gonflage||{},
        kit:v.kit||null,kitManq:v.kitManq||'',
        nett:v.nett||{},devis:v.devis||[],note:v.note||'',
        photos:v.photos||[]
      }))
      .sort((a,b)=>b.date.localeCompare(a.date));
  },
  async upsertInspection(insp){
    const {id,...rest}=insp;
    const r=await fetch(FB_URL+'/inspections/'+encodeURIComponent(id)+'.json',{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(rest)
    });
    if(!r.ok)throw new Error('Erreur sauvegarde contrôle');
  },
  async deleteInspection(id){
    const r=await fetch(FB_URL+'/inspections/'+encodeURIComponent(id)+'.json',{method:'DELETE'});
    if(!r.ok)throw new Error('Erreur suppression contrôle');
  }
};

/* ── Image compression ── */
const compress=f=>new Promise(res=>{
  const rd=new FileReader();
  rd.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const M=900,cv=document.createElement('canvas');
      let w=img.width,h=img.height;
      if(w>M||h>M){if(w>h){h=Math.round(h*M/w);w=M;}else{w=Math.round(w*M/h);h=M;}}
      cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      res(cv.toDataURL('image/jpeg',.72));
    };
    img.src=ev.target.result;
  };
  rd.readAsDataURL(f);
});

/* ── Capture form inputs before re-render ── */
function snap(){
  if((S.view!=='inspect'&&S.view!=='edit-insp')||!S.form)return;
  const g=id=>document.getElementById(id);
  if(g('f-date'))S.form.date=g('f-date').value;
  if(g('f-agent'))S.form.agent=g('f-agent').value;
  if(g('f-kit-manq'))S.form.kitManq=g('f-kit-manq').value;
  if(g('f-note'))S.form.note=g('f-note').value;
  document.querySelectorAll('.devis-in').forEach(el=>{
    const i=parseInt(el.dataset.di),f=el.dataset.df;
    if(S.form.devis&&S.form.devis[i]!=null)S.form.devis[i][f]=el.value;
  });
}

/* ── Navigation ── */
function go(view,extra){
  snap();
  if(extra)Object.assign(S,extra);
  S.view=view;
  draw();
  window.scrollTo(0,0);
}

/* ── Render ── */
function draw(){
  const el=document.getElementById('app');
  if(!el)return;
  const views={home:vHome,station:vStation,inspect:vInspect,detail:vDetail,add:vAdd,edit:vEdit,rapport:vRapport,anomalie:vAnomalie,compile:vCompile,'edit-insp':vInspect};
  el.innerHTML=(views[S.view]||vHome)();
  el.removeEventListener('click',onCk);
  el.removeEventListener('change',onCh);
  el.addEventListener('click',onCk);
  el.addEventListener('change',onCh);
}

/* ── Views ── */
function vHome(){
  const cnt=sid=>S.inspections.filter(i=>i.sid===sid).length;
  const last=sid=>{
    const a=S.inspections.filter(i=>i.sid===sid).sort((a,b)=>b.date.localeCompare(a.date));
    return a[0]||null;
  };
  const gpsUrl=addr=>s.id==='s4'
    ?`https://www.google.com/maps/dir/?api=1&destination=47.46932164421001,-0.5704969438935711`
    :`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(addr+', Angers')}`;
  const card=s=>{
    const n=cnt(s.id),l=last(s.id);
    const hp=l&&(()=>{const allSecs=[l.struct,l.gonflage,l.kit,l.nett].filter(Boolean);return allSecs.some(obj=>Object.values(obj).some(v=>v==='def'||v==='rem'));})();
    const dot=!l?'#ccc':hp?'#BA7517':'#639922';
    const fx=s.type.includes('Fix');
    return `<div class="sc" data-a="go-st" data-sid="${s.id}">
      <div class="sc-ic${fx?' fx':''}"><span>${fx?'🔧':'💨'}</span></div>
      <div class="sc-in"><div class="sc-ad">${esc(s.addr)}</div><div class="sc-ty">${esc(s.type)}</div></div>
      <div class="sc-me">
        <span class="sc-ct">${n} contrôle${n!==1?'s':''}</span>
        <a href="${gpsUrl(s.addr)}" target="_blank" rel="noopener" class="gps-btn" onclick="event.stopPropagation()" title="Ouvrir dans Google Maps">🗺️</a>
        <span class="dot" style="background:${dot}"></span>
      </div>
    </div>`;
  };
  const pumps=S.stations.filter(s=>s.type==='ALTAO Pump');
  const fix=S.stations.filter(s=>s.type==="ALTAO Fix'Air");
  const oth=S.stations.filter(s=>s.type!=='ALTAO Pump'&&s.type!=="ALTAO Fix'Air");
  const sig=S.inspections.filter(i=>{
    const sec=getSections(S.stations.find(s=>s.id===i.sid)?.type||'');
    const allSecs=[i.struct,i.gonflage,i.kit,i.nett].filter(Boolean);
    return allSecs.some(obj=>Object.values(obj).some(v=>v==='def'||v==='rem'));
  }).length;
  return `
  <div class="hdr">
    <div style="flex:1;min-width:0">
      <div class="hdr-title">🚲 Bornes de Gonflage</div>
      <div class="hdr-sub">Angers Mob Service</div>
    </div>
    <button class="hdr-btn" data-a="toggle-admin" style="background:${S.isAdmin?'rgba(255,255,255,.35)':'rgba(255,255,255,.15)'}" title="${S.isAdmin?'Déconnexion admin':'Accès admin'}">${S.isAdmin?'🔓 Admin':'🔒'}</button>
    ${S.isAdmin?`<button class="hdr-btn" data-a="go-rapport">📄 Rapport</button><button class="hdr-btn" data-a="go-add">＋ Borne</button>`:''}
  </div>
  <div class="pg">
    <div class="stats">
      <div class="stat"><div class="stat-n">${S.stations.length}</div><div class="stat-l">Bornes</div></div>
      <div class="stat"><div class="stat-n">${S.inspections.length}</div><div class="stat-l">Contrôles</div></div>
      <div class="stat"><div class="stat-n" style="${sig>0?'color:var(--o)':''}">${sig}</div><div class="stat-l">Signalements</div></div>
    </div>
    <div class="sec">💨 ALTAO Pump · ${pumps.length}</div>
    ${pumps.map(card).join('')}
    <div class="sec mt">🔧 ALTAO Fix'Air · ${fix.length}</div>
    ${fix.map(card).join('')}
    ${oth.length?`<div class="sec mt">📍 Autres · ${oth.length}</div>${oth.map(card).join('')}`:''}
  </div>`;
}

function vStation(){
  const st=S.stations.find(s=>s.id===S.sid);
  if(!st)return vHome();
  const ins=S.inspections.filter(i=>i.sid===S.sid).sort((a,b)=>b.date.localeCompare(a.date));
  const row=i=>{
    const allSecs=[i.struct,i.gonflage,i.kit,i.nett].filter(Boolean);
    const hp=allSecs.some(obj=>Object.values(obj).some(v=>v==='def'||v==='rem'));
    const nd=allSecs.reduce((acc,obj)=>acc+Object.values(obj).filter(v=>v==='def'||v==='rem').length,0);
    const dot=hp?'#BA7517':'#639922';
    const hasDevis=i.devis&&i.devis.some(r=>r.designation);
    return `<div class="ir" data-a="go-det" data-iid="${i.id}">
      <span class="dot" style="background:${dot};flex-shrink:0"></span>
      <div style="flex:1;min-width:0">
        <div class="ir-d">${fdate(i.date)}</div>
        <div class="ir-a">${esc(i.agent)||'Agent n.r.'}</div>
        <div class="tags">
          ${nd?`<span class="badge b-w">⚠ ${nd} anomalie${nd>1?'s':''}</span>`:'<span class="badge b-ok">✓ RAS</span>'}
          ${hasDevis?`<span class="badge b-w">📝 Devis</span>`:''}
          ${i.photos&&i.photos.length?`<span class="badge b-i">📷 ${i.photos.length}</span>`:''}
        </div>
      </div>
      <span style="color:var(--muted);font-size:18px">›</span>
    </div>`;
  };
  const gpsUrl=st.id==='s4'
    ?`https://www.google.com/maps/dir/?api=1&destination=47.46932164421001,-0.5704969438935711`
    :`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(st.addr+', Angers')}`;
  return `
  <div class="hdr">
    <button class="hdr-back" data-a="back">←</button>
    <div style="flex:1;min-width:0">
      <div class="hdr-title">${esc(st.addr)}</div>
      <div class="hdr-sub">${esc(st.type)}</div>
    </div>
    <a href="${gpsUrl}" target="_blank" rel="noopener" class="hdr-btn" title="Ouvrir dans Google Maps">🗺️ GPS</a>
    <button class="hdr-btn" data-a="go-anomalie" title="Rapport anomalies">⚠️</button>
    ${S.isAdmin?`<button class="hdr-btn" data-a="go-edit" style="background:rgba(255,255,255,.15)">✏️</button>`:''}
    <button class="hdr-btn" data-a="new-insp">＋ Contrôle</button>
  </div>
  <div class="pg">
    ${ins.length===0
      ?`<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">Aucun contrôle enregistré<br>pour cette borne.</div><button class="btn btn-p mt8" data-a="new-insp" style="margin:20px auto 0">＋ Premier contrôle</button></div>`
      :`<div class="sec">${ins.length} contrôle${ins.length>1?'s':''}</div>${ins.map(row).join('')}`
    }
    ${S.isAdmin?`<div id="del-st-z" class="mt16">
      <button class="btn btn-f" data-a="ask-del-st" style="color:var(--muted)">🗑 Supprimer cette borne</button>
    </div>`:''}
  </div>`;

function vInspect(){
  const st=S.stations.find(s=>s.id===S.sid),f=S.form;

  /* Ligne de checkbox OK / Défaut / À remplacer */

    const val=f[secName]?f[secName][k]||'':'';

      <span class="chk-lbl">${esc(l)}</span>

      <div class="chk-header"><span></span><span class="chk-col-hd">OK</span><span class="chk-col-hd">Défaut</span><span class="chk-col-hd">À rempl.</span></div>

/* ── Export compilation anomalies ── */
function doCompileExport(){
  const items=S.stations.map(st=>{
    const r=getAnomalies(st.id);
    const sel=!S.compile||S.compile[st.id]!==false;
    return {st,r,sel};
  }).filter(({sel,r})=>sel&&r);

  if(!items.length){alert('Aucune borne sélectionnée avec un contrôle.');return;}

  const blocsHtml=items.map(({st,r})=>{
    const totalAnom=r.anomalies.reduce((a,s)=>a+s.items.length,0);
    const anomSecs=r.anomalies.length===0
      ?`<p style="color:#3B6D11;font-weight:600;margin:8px 0">✅ Aucune anomalie constatée</p>`
      :r.anomalies.map(sec=>`
        <div style="margin:10px 0 4px;font-size:.8rem;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid #eee;padding-bottom:3px">${sec.titre}</div>
        ${sec.items.map(({l,v})=>`<div style="display:flex;align-items:flex-start;gap:8px;padding:4px 0;border-bottom:1px solid #f5f5f5;font-size:.88rem">
          <span style="flex-shrink:0;font-weight:700;${v==='rem'?'color:#c0392b':'color:#BA7517'}">${v==='rem'?'✗ À remplacer':'⚠ Défaut'}</span>
          <span>${esc(l)}</span>
        </div>`).join('')}`).join('');

    const devisHtml=r.hasDevis?`
      <div style="margin:12px 0 4px;font-size:.8rem;font-weight:700;color:#BA7517;text-transform:uppercase;letter-spacing:.04em">📝 Devis à établir</div>
      <table style="width:100%;border-collapse:collapse;font-size:.82rem">
        <thead><tr style="background:#fff8e6">
          <th style="padding:4px 6px;text-align:left;border:1px solid #ddd">Réf.</th>
          <th style="padding:4px 6px;text-align:left;border:1px solid #ddd">Désignation</th>
          <th style="padding:4px 6px;border:1px solid #ddd">Qté</th>
          <th style="padding:4px 6px;border:1px solid #ddd">PU HT (€)</th>
        </tr></thead>
        <tbody>${r.insp.devis.filter(d=>d.designation).map(d=>`<tr>
          <td style="padding:4px 6px;border:1px solid #ddd">${esc(d.ref)}</td>
          <td style="padding:4px 6px;border:1px solid #ddd">${esc(d.designation)}</td>
          <td style="padding:4px 6px;text-align:center;border:1px solid #ddd">${esc(d.qte)}</td>
          <td style="padding:4px 6px;text-align:right;border:1px solid #ddd">${esc(d.pu)}</td>
        </tr>`).join('')}</tbody>
      </table>`:'';

    const noteHtml=r.insp.note?`<p style="font-size:.85rem;color:#555;background:#f7f7f7;padding:7px 10px;border-radius:6px;margin:8px 0;font-style:italic">${esc(r.insp.note)}</p>`:'';

    return `<div style="page-break-inside:avoid;border:1px solid ${totalAnom?'#f5c842':'#c8e6a0'};border-left:4px solid ${totalAnom?'#BA7517':'#3B6D11'};border-radius:6px;padding:14px;margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid #eee">
        <div>
          <div style="font-weight:700;font-size:.95rem">${esc(st.addr)}</div>
          <div style="font-size:.8rem;color:#666;margin-top:2px">${esc(st.type)} · Contrôle du ${fdate(r.insp.date)} · ${esc(r.insp.agent)||'N.R.'}</div>
        </div>
        ${totalAnom?`<span style="background:#fff3cd;color:#856404;padding:3px 10px;border-radius:20px;font-size:.8rem;font-weight:700;flex-shrink:0">⚠ ${totalAnom} anomalie${totalAnom>1?'s':''}</span>`:'<span style="background:#d4edda;color:#155724;padding:3px 10px;border-radius:20px;font-size:.8rem;font-weight:700;flex-shrink:0">✓ RAS</span>'}
      </div>
      ${anomSecs}${devisHtml}${noteHtml}
    </div>`;
  }).join('');

function getAnomalies(sid){
  const st=S.stations.find(s=>s.id===sid);
  if(!st)return null;
  const insps=S.inspections.filter(i=>i.sid===sid).sort((a,b)=>b.date.localeCompare(a.date));
  if(!insps.length)return null;
  const insp=insps[0];
  const sec=getSections(st.type);
  const anomalies=[];
  const sections=[
    ['🏗 Structure générale',sec.struct,insp.struct],
    ['💨 Système de gonflage',sec.gonflage,insp.gonflage],
    ...(sec.kit?[['🔧 Kit 7 outils',sec.kit,insp.kit]]:[]),
    ['🧹 Nettoyage',sec.nett,insp.nett],
  ];
  for(const [titre,items,data] of sections){
    const anom=items.filter(([k])=>data&&(data[k]==='def'||data[k]==='rem'));
    if(anom.length)anomalies.push({titre,items:anom.map(([k,l])=>({l,v:data[k]}))});
  }
  const hasDevis=insp.devis&&insp.devis.some(r=>r.designation);
  return {insp,st,anomalies,hasDevis};
}

/* ── Event handlers ── */
async function onCk(e){
  const el=e.target.closest('[data-a]');
  if(!el)return;
  const a=el.dataset.a;
  if(a==='go-st'){go('station',{sid:el.dataset.sid});}
  else if(a==='toggle-admin'){
    if(S.isAdmin){S.isAdmin=false;draw();}
    else{
      const pwd=prompt('Mot de passe administrateur :');
      if(pwd===ADMIN_PWD){S.isAdmin=true;draw();}
      else if(pwd!==null){alert('Mot de passe incorrect.');}
    }
  }
  else if(a==='back'){
    if(S.view==='station')go('home');
    else if(S.view==='inspect'){S.editIid=null;go('station');}
    else if(S.view==='edit-insp'){S.editIid=null;go('detail',{iid:S.iid});}
    else if(S.view==='anomalie')go('station');
    else if(S.view==='compile')go('rapport');
    else if(S.view==='detail')go('station');
    else if(S.view==='edit')go('station');
    else if(S.view==='rapport')go('home');
    else go('home');
  }
  else if(a==='go-add'){go('add');}
  else if(a==='go-edit'){go('edit');}
  else if(a==='save-edit'){
    const addr=(document.getElementById('edit-addr')?.value||'').trim();
    const type=document.getElementById('edit-type')?.value||'Autre';
    if(!addr)return;
    const updated={...S.stations.find(s=>s.id===S.sid),addr,type};
    try{
      await DB.upsertStation(updated);
      S.stations=S.stations.map(s=>s.id===S.sid?updated:s);
      go('station');
    }catch(e){alert('Erreur sauvegarde : '+e.message);}
  }
  else if(a==='new-insp'){S.editIid=null;S.form=mkForm(S.sid);go('inspect');}
  else if(a==='edit-insp'){
    const insp=S.inspections.find(i=>i.id===S.iid);
    if(!insp)return;
    S.editIid=insp.id;
    S.form=JSON.parse(JSON.stringify(insp)); /* deep copy */
    go('edit-insp');
  }
  else if(a==='go-anomalie'){go('anomalie');}
  else if(a==='go-compile'){if(S.isAdmin)go('compile');}
  else if(a==='print-compile'){doCompileExport();}
  else if(a==='go-rapport'){if(S.isAdmin)go('rapport');}
  else if(a==='go-det'){go('detail',{iid:el.dataset.iid});}
  else if(a==='add-ph'){document.getElementById('ph-in').click();}
  else if(a==='del-ph'){
    snap();
    const idx=parseInt(el.dataset.idx);
    S.form.photos=S.form.photos.filter((_,i)=>i!==idx);
    draw();
  }
  else if(a==='add-devis'){
    snap();
    S.form.devis=[...(S.form.devis||[]),{ref:'',designation:'',qte:'',pu:''}];
    draw();
  }
  else if(a==='del-devis'){
    snap();
    const idx=parseInt(el.dataset.idx);
    S.form.devis=S.form.devis.filter((_,i)=>i!==idx);
    draw();
  }
  else if(a==='save-insp'){
    snap();
    /* Validation photo */
    if(!S.form.photos||S.form.photos.length===0){
      alert('📷 Veuillez ajouter au moins une photo avant d\'enregistrer.');
      return;
    }
    /* Validation nom contrôleur */
    if(!(S.form.agent||'').trim()){
      alert('👤 Veuillez saisir le nom du technicien / agent.');
      return;
    }
    /* Validation coches — toutes les lignes doivent être renseignées */
    const st2=S.stations.find(s=>s.id===S.form.sid);
    const sec2=getSections(st2?st2.type:'');
    const sections2=[['struct',sec2.struct],['gonflage',sec2.gonflage],['nett',sec2.nett]];
    if(sec2.kit)sections2.push(['kit',sec2.kit]);
    const nomSection={'struct':'Structure générale','gonflage':'Système de gonflage','nett':'Nettoyage','kit':'Kit 7 outils'};
    for(const [secName,items] of sections2){
      for(const [k] of items){
        if(!S.form[secName]||!S.form[secName][k]){
          alert(`☑️ Toutes les lignes doivent être cochées.\n\nSection manquante : ${nomSection[secName]}`);
          return;
        }
      }
    }
    const insp=Object.assign({},S.form,{photos:[...(S.form.photos||[])]});
    const btn=el;
    btn.disabled=true;btn.textContent='⏳ Enregistrement…';
    try{
      await DB.upsertInspection(insp);
      if(S.editIid){
        S.inspections=S.inspections.map(i=>i.id===S.editIid?insp:i);
        S.editIid=null;
      } else {
        S.inspections=[...S.inspections,insp];
      }
      go('station');
    }catch(e){
      btn.disabled=false;
      btn.textContent=S.editIid?'💾 Enregistrer les modifications':'💾 Enregistrer le contrôle';
      alert('Erreur sauvegarde : '+e.message);
    }
  }
  else if(a==='gen-rapport'){snapRapport();doRapport();}
  else if(a==='ask-del-insp'){
    const z=document.getElementById('del-insp-z');
    if(z)z.innerHTML=`<div class="alert-card"><div class="alert-title">⚠ Supprimer ce contrôle ?</div><div class="btn-row"><button class="btn btn-d" data-a="do-del-insp">🗑 Supprimer</button><button class="btn" data-a="cancel-del">Annuler</button></div></div>`;
  }
  else if(a==='do-del-insp'){
    try{
      await DB.deleteInspection(S.iid);
      S.inspections=S.inspections.filter(i=>i.id!==S.iid);
      go('station');
    }catch(e){alert('Erreur suppression : '+e.message);}
  }
  else if(a==='cancel-del'){draw();}
  else if(a==='ask-del-st'){
    const z=document.getElementById('del-st-z');
    if(z)z.innerHTML=`<div class="alert-card"><div class="alert-title">⚠ Supprimer cette borne ?</div><div class="alert-body">Tous les contrôles associés seront supprimés.</div><div class="btn-row"><button class="btn btn-d" data-a="do-del-st">🗑 Supprimer</button><button class="btn" data-a="cancel-del">Annuler</button></div></div>`;
  }
  else if(a==='do-del-st'){
    try{
      await DB.deleteStation(S.sid);
      S.stations=S.stations.filter(s=>s.id!==S.sid);
      S.inspections=S.inspections.filter(i=>i.sid!==S.sid);
      go('home');
    }catch(e){alert('Erreur suppression : '+e.message);}
  }
  else if(a==='save-add'){
    const addr=(document.getElementById('add-addr')?.value||'').trim();
    const type=document.getElementById('add-type')?.value||'Autre';
    if(!addr)return;
    const newSt={id:uid(),type,addr};
    try{
      await DB.upsertStation(newSt);
      S.stations=[...S.stations,newSt];
      go('home');
    }catch(e){alert('Erreur ajout : '+e.message);}
  }
}

function onCh(e){
  const el=e.target;
  const sec=el.dataset.sec,key=el.dataset.key;
  if(sec&&key&&S.form){
    if(el.type==='radio'){S.form[sec][key]=el.value;}
    else if(el.type==='checkbox'){S.form[sec][key]=el.checked;}
    return;
  }
  /* Rapport : filtres en temps réel */
  if(el.dataset.rpt&&S.view==='rapport'){
    snapRapport();
    draw();
  }
  /* Compilation anomalies */
  if(el.dataset.cpl&&S.view==='compile'){
    S.compile=S.compile||{};
    if(el.dataset.cpl==='selAll'){
      S.stations.forEach(st=>{S.compile[st.id]=el.checked;});
    } else if(el.dataset.cpl==='borne'){
      S.compile[el.dataset.sid]=el.checked;
    }
    draw();
  }
}

function snapRapport(){
  if(S.view!=='rapport')return;
  const R=S.rapport;
  const from=document.getElementById('rpt-from'),to=document.getElementById('rpt-to');
  if(from)R.dateFrom=from.value;
  if(to)R.dateTo=to.value;
  const selAll=document.querySelector('[data-rpt="selAll"]');
  if(selAll)R.selAll=selAll.checked;
  document.querySelectorAll('[data-rpt="borne"]').forEach(cb=>{
    R.bornes[cb.dataset.sid]=cb.checked;
  });
  document.querySelectorAll('[data-rpt="choix"]').forEach(sel=>{
    R.choix[sel.dataset.sid]=sel.value;
  });
}

document.getElementById('ph-in').addEventListener('change',async function(e){
  const files=Array.from(e.target.files);
  if(!files.length)return;
  snap();
  const comp=await Promise.all(files.map(compress));
  S.form.photos=[...(S.form.photos||[]),...comp];
  e.target.value='';
  draw();
});

/* ── Init ── */
async function init(){
  document.getElementById('app').innerHTML=`
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:16px;color:var(--muted)">
      <div style="font-size:2rem">🚲</div>
      <div style="font-size:14px">Chargement des données…</div>
    </div>`;
  try{
    const [stations,inspections]=await Promise.all([DB.getStations(),DB.getInspections()]);
    S.stations=stations;
    S.inspections=inspections;
  }catch(e){
    document.getElementById('app').innerHTML=`
      <div style="padding:24px;text-align:center;color:var(--r)">
        <div style="font-size:2rem">⚠️</div>
        <div style="margin-top:12px;font-weight:600">Impossible de se connecter à la base de données</div>
        <div style="font-size:13px;color:var(--muted);margin-top:8px">${e.message}</div>
        <button class="btn btn-p" style="margin-top:16px" onclick="init()">Réessayer</button>
      </div>`;
    return;
  }
  draw();
}
init();
</script>
